            <span class="callout-icon"><i data-lucide="magnet"></i></span>
            <div>高内聚：<strong class="font-semibold text-neutral-900">一个模块内部的代码应该尽可能围绕同一个业务职责。</strong></div>

          <p class="doc-p">例如：</p>
          <figure class="diagram-card">
            <figcaption class="diagram-head">users/</figcaption>

├── user.repository.ts
├── user.dto.ts
└── user.entity.ts</pre>
          </figure>
          <p class="doc-p">这些代码都围绕 <code>User</code>，因此具有较高的内聚性。</p>
