<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18 依赖抽象 · TS 后端架构</title>
  <meta name="description" content="从最基础的 HTTP 接口开始，逐步理解 TypeScript 后端的分层、模块化、依赖注入、依赖倒置，以及高内聚、低耦合的工程化架构。">
  <meta name="theme-color" content="#ffffff">

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide 图标库 (CDN) -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- 公共样式由父页面 index.html 通过 postMessage 注入；直接打开时由 assets/section.js 从 index.html 抓取 -->
</head>

<body data-section="abstraction" class="doc-body bg-white font-sans text-neutral-800 antialiased px-3 pb-4 pt-1">

        <!-- 18 依赖抽象 -->
        <section id="abstraction" class="doc-section">
          <header class="mb-5 flex items-start gap-3">
            <span class="sec-num">18</span>
            <div>
              <p class="eyebrow">模块与耦合</p>
              <h2 class="sec-title">依赖抽象</h2>
            </div>
          </header>
          <p class="doc-p">更好的方式：</p>
          <div class="flow flow-sm">
            <div class="flow-node">UserService</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node">UserRepository</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node flow-node-accent">PrismaUserRepository</div>
          </div>
          <p class="doc-p">Service 只依赖抽象：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">interface UserRepository {
  findById(id: string): Promise&lt;User | null&gt;;
}</code></pre>
          </figure>
          <p class="doc-p">具体实现：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">class PrismaUserRepository implements UserRepository {
  async findById(id: string) {
    return this.prisma.user.findUnique({
      where: { id },
    });
  }
}</code></pre>
          </figure>
          <div class="my-4 grid gap-4 sm:grid-cols-2">
            <div class="rounded-xl border border-neutral-200 bg-neutral-50 p-4">
              <p class="text-sm font-bold text-neutral-400">Service 不需要知道</p>
              <div class="mt-3 flex flex-wrap gap-1.5">
                <span class="chip">Prisma</span>
                <span class="chip">PostgreSQL</span>
                <span class="chip">MySQL</span>
                <span class="chip">MongoDB</span>
              </div>
            </div>
            <div class="rounded-xl border border-neutral-900 bg-white p-4">
              <p class="text-sm font-bold text-neutral-900">它只知道</p>
              <div class="mt-3 flex flex-wrap gap-1.5">
                <span class="chip">UserRepository</span>
              </div>
            </div>
          </div>
          <p class="doc-p">这就是降低耦合的核心手段之一。</p>
        </section>

  <!-- highlight.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/http.min.js"></script>
  <!-- 小节共用脚本：高亮、复制、图标、高度同步 -->
  <script src="../assets/section.js"></script>
</body>
</html>
