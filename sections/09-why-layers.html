  <meta name="theme-color" content="#ffffff">

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-section="why-layers" class="doc-body bg-white font-sans text-neutral-800 antialiased px-3 pb-4 pt-1">

        <!-- 09 为什么要分层 -->
        <section id="why-layers" class="doc-section">
          <header class="mb-5 flex items-start gap-3">
            <span class="sec-num">09</span>
            <div>
              <p class="eyebrow">分层篇</p>
              <h2 class="sec-title">为什么要分层？</h2>
            </div>
          </header>
          <p class="doc-p">因为每一层都有明确职责：</p>
          <div class="my-4 grid gap-4 sm:grid-cols-3">
            <div class="layer-card">
              <p class="layer-name">Controller</p>
              <p class="layer-role">HTTP</p>
            </div>
            <div class="layer-card">
              <p class="layer-name">Service</p>
              <p class="layer-role">Business</p>
            </div>
            <div class="layer-card">
              <p class="layer-name">Repository</p>
              <p class="layer-role">Data Access</p>
            </div>
          </div>
          <p class="doc-p">这体现的是：</p>
          <div class="callout callout-key">
            <span class="callout-icon"><i data-lucide="crosshair"></i></span>
            <div><strong class="font-semibold text-neutral-900">单一职责原则（Single Responsibility Principle）</strong></div>
          </div>
          <p class="doc-p">一个模块应该主要负责一个明确的变化原因。</p>
        </section>
