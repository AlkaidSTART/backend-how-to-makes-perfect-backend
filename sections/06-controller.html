<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06 Controller · TS 后端架构</title>
  <meta name="description" content="从最基础的 HTTP 接口开始，逐步理解 TypeScript 后端的分层、模块化、依赖注入、依赖倒置，以及高内聚、低耦合的工程化架构。">
  <meta name="theme-color" content="#ffffff">

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide 图标库 (CDN) -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- 公共样式由父页面 index.html 通过 postMessage 注入；直接打开时由 assets/section.js 从 index.html 抓取 -->
</head>

<body data-section="controller" class="doc-body bg-white font-sans text-neutral-800 antialiased px-3 pb-4 pt-1">

        <!-- 06 Controller -->
        <section id="controller" class="doc-section">
          <header class="mb-5 flex items-start gap-3">
            <span class="sec-num">06</span>
            <div>
              <p class="eyebrow">分层篇</p>
              <h2 class="sec-title">Controller</h2>
            </div>
          </header>
          <div class="callout callout-key">
            <span class="callout-icon"><i data-lucide="target"></i></span>
            <div>Controller 的职责：<strong class="font-semibold text-neutral-900">负责 HTTP 层。</strong></div>
          </div>
          <p class="doc-p">例如：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">class UserController {
  async getUser(req, res) {
    const user = await this.userService.getUser(req.params.id);

    return res.json(user);
  }
}</code></pre>
          </figure>
          <p class="doc-p">Controller 主要负责：</p>
          <div class="flow flow-sm">
            <div class="flow-node">HTTP Request</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node">获取参数</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node">调用业务</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node flow-node-accent">HTTP Response</div>
          </div>
          <p class="doc-p">Controller 不应该承担复杂业务逻辑。不推荐：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="flex items-center gap-2">
                <span class="code-flag bad">不推荐</span>
                <span class="code-lang">TypeScript</span>
              </span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">async getUser(req, res) {
  const user = await db.user.findUnique({
    where: {
      id: req.params.id,
    },
  });

  if (!user) {
    throw new Error("用户不存在");
  }

  if (user.status === "banned") {
    throw new Error("用户被封禁");
  }

  // 一堆业务逻辑……
}</code></pre>
          </figure>
          <p class="doc-p font-semibold text-neutral-800">问题：</p>
          <ul class="my-3 space-y-2">
            <li class="cross-item"><span class="cross-dot"><i data-lucide="x"></i></span>Controller 太胖</li>
            <li class="cross-item"><span class="cross-dot"><i data-lucide="x"></i></span>HTTP 与业务耦合</li>
            <li class="cross-item"><span class="cross-dot"><i data-lucide="x"></i></span>数据库与 Controller 耦合</li>
            <li class="cross-item"><span class="cross-dot"><i data-lucide="x"></i></span>难以测试</li>
            <li class="cross-item"><span class="cross-dot"><i data-lucide="x"></i></span>难以复用业务逻辑</li>
          </ul>
        </section>

  <!-- highlight.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/http.min.js"></script>
  <!-- 小节共用脚本：高亮、复制、图标、高度同步 -->
  <script src="../assets/section.js"></script>
</body>
</html>
