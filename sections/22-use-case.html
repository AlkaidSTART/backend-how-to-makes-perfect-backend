          <header class="mb-5 flex items-start gap-3">
            <span class="sec-num">22</span>

              <p class="eyebrow">进阶架构</p>
              <h2 class="sec-title">第九阶段：Use Case</h2>
            </div>
          </header>
          <p class="doc-p">当业务越来越复杂，可以从简单 Service 进一步演进到 Use Case。一个 Use Case 表示：</p>
          <div class="callout callout-key">
            <span class="callout-icon"><i data-lucide="clapperboard"></i></span>
            <div><strong class="font-semibold text-neutral-900">一个完整的业务动作。</strong></div>
          </div>
          <p class="doc-p">例如：</p>
          <div class="my-4 flex flex-wrap gap-2">
            <span class="chip">RegisterUserUseCase</span>
            <span class="chip">LoginUserUseCase</span>
            <span class="chip">CreateOrderUseCase</span>
            <span class="chip">PayOrderUseCase</span>
            <span class="chip">CancelOrderUseCase</span>
          </div>
          <p class="doc-p">例如注册：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">class RegisterUserUseCase {
  constructor(
    private readonly userRepository: UserRepository,
    private readonly passwordHasher: PasswordHasher,
  ) {}

  async execute(input: RegisterUserInput) {
    const exists =
      await this.userRepository.findByEmail(input.email);

    if (exists) {
      throw new EmailAlreadyExistsError();
    }

    const password =
      await this.passwordHasher.hash(input.password);

    return this.userRepository.create({
      email: input.email,
      password,
    });
  }
}</code></pre>
          </figure>
          <p class="doc-p">Use Case 不应该直接依赖：</p>
          <div class="my-3 flex flex-wrap gap-2">
            <span class="chip">Prisma</span>
            <span class="chip">PostgreSQL</span>
            <span class="chip">bcrypt</span>

            <span class="chip">NestJS</span>
            <span class="chip">HTTP</span>
          </div>
          <p class="doc-p">而应该依赖抽象。</p>
