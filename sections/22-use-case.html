          <p class="doc-p">当业务越来越复杂，可以从简单 Service 进一步演进到 Use Case。一个 Use Case 表示：</p>

          <p class="doc-p">例如注册：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">class RegisterUserUseCase {
  constructor(
    private readonly userRepository: UserRepository,
    private readonly passwordHasher: PasswordHasher,
  ) {}

  async execute(input: RegisterUserInput) {
    const exists =
      await this.userRepository.findByEmail(input.email);

    if (exists) {
      throw new EmailAlreadyExistsError();
    }

    const password =
      await this.passwordHasher.hash(input.password);

    return this.userRepository.create({
      email: input.email,
      password,
    });
  }
}</code></pre>
          </figure>
