        <!-- 26 后端架构核心认知 -->
        <section id="core-insight" class="doc-section">
          <header class="mb-5 flex items-start gap-3">
            <span class="sec-num">26</span>
            <div>
              <p class="eyebrow">实战与总结</p>
              <h2 class="sec-title">后端架构核心认知</h2>
            </div>
          </header>
          <p class="doc-p">整个架构可以浓缩成一句话：</p>
          <div class="big-quote">
            <p class="banner-tag">Core Insight</p>
            <p class="banner-text">让变化频繁的东西依赖变化稳定的东西，<br class="hidden sm:block">让每个模块只负责自己真正应该负责的事情。</p>
          </div>
          <p class="doc-p">例如：</p>
          <div class="my-4 max-w-md space-y-2">
            <div class="flex items-center justify-between rounded-lg border border-neutral-200 bg-white px-4 py-2.5 shadow-sm">
              <span class="font-mono text-sm font-semibold text-neutral-800">HTTP</span>
              <span class="tier-tag tag-low">变化快</span>
            </div>
            <div class="flex items-center justify-between rounded-lg border border-neutral-200 bg-white px-4 py-2.5 shadow-sm">
              <span class="font-mono text-sm font-semibold text-neutral-800">NestJS</span>
              <span class="tier-tag tag-mid">可能更换</span>
            </div>
            <div class="flex items-center justify-between rounded-lg border border-neutral-200 bg-white px-4 py-2.5 shadow-sm">
              <span class="font-mono text-sm font-semibold text-neutral-800">Prisma</span>
              <span class="tier-tag tag-mid">可能更换</span>
            </div>
            <div class="flex items-center justify-between rounded-lg border border-neutral-200 bg-white px-4 py-2.5 shadow-sm">
              <span class="font-mono text-sm font-semibold text-neutral-800">PostgreSQL</span>
              <span class="tier-tag tag-high">相对稳定</span>
            </div>
            <div class="flex items-center justify-between rounded-lg border border-neutral-900 bg-white px-4 py-2.5 shadow-sm">
              <span class="font-mono text-sm font-bold text-neutral-900">业务规则</span>
              <span class="tier-tag tag-core">核心</span>
            </div>
          </div>
          <p class="doc-p">不要让 <code>业务逻辑</code> 被 <code>HTTP</code>、<code>ORM</code>、<code>Framework</code>、<code>Database</code> 绑死。</p>
          <p class="doc-p">这就是架构设计的核心之一。</p>
        </section>
