<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#ffffff">

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

<body data-section="stage1" class="doc-body bg-white font-sans text-neutral-800 antialiased px-3 pb-4 pt-1">

        <!-- 02 第一阶段：理解后端 -->
        <section id="stage1" class="doc-section">
          <header class="mb-5 flex items-start gap-3">
            <span class="sec-num">02</span>
            <div>
              <p class="eyebrow">基础篇</p>
              <h2 class="sec-title">第一阶段：理解后端</h2>
            </div>
          </header>
          <p class="doc-p">不要一开始就学框架，先理解后端的基本工作方式。</p>
          <div class="flow">
            <div class="flow-node">客户端</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node">HTTP Request</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node">后端服务器</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node">业务处理</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node">数据库</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node flow-node-accent">HTTP Response</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node">客户端（收到响应）</div>
          </div>
          <p class="doc-p">例如：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">HTTP</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-http">POST /users
Content-Type: application/json

{
  "name": "Alkaid",
  "email": "test@example.com"
}</code></pre>
          </figure>
          <p class="doc-p">后端完成业务处理后返回：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">JSON</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-json">{
  "id": "123",
  "name": "Alkaid",
  "email": "test@example.com"
}</code></pre>
          </figure>
        </section>

  <!-- highlight.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
