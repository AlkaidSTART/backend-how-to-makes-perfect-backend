<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>11 DTO ≠ Entity ≠ Database Model · TS 后端架构</title>
  <meta name="description" content="从最基础的 HTTP 接口开始，逐步理解 TypeScript 后端的分层、模块化、依赖注入、依赖倒置，以及高内聚、低耦合的工程化架构。">
  <meta name="theme-color" content="#ffffff">

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

<body data-section="dto-vs-entity" class="doc-body bg-white font-sans text-neutral-800 antialiased px-3 pb-4 pt-1">

        <!-- 11 DTO ≠ Entity ≠ Database Model -->
        <section id="dto-vs-entity" class="doc-section">
          <header class="mb-5 flex items-start gap-3">
            <span class="sec-num">11</span>
            <div>
              <p class="eyebrow">数据与校验</p>
              <h2 class="sec-title">DTO ≠ Entity ≠ Database Model</h2>
            </div>
          </header>
          <p class="doc-p">这是后端学习中的重要概念。</p>
          <div class="my-4 grid gap-4 lg:grid-cols-3">
            <div class="rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">
              <p class="font-mono text-sm font-bold text-neutral-900">DTO</p>
              <p class="mt-2 text-sm leading-6 text-neutral-600">描述：<strong class="font-semibold text-neutral-800">API 输入 / 输出</strong></p>
              <div class="mt-3 flex flex-wrap gap-1.5">
                <span class="chip">CreateUserDto</span>
                <span class="chip">UpdateUserDto</span>
                <span class="chip">LoginDto</span>
              </div>
            </div>
            <div class="rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">
              <p class="font-mono text-sm font-bold text-neutral-900">Entity</p>
              <p class="mt-2 text-sm leading-6 text-neutral-600">描述：<strong class="font-semibold text-neutral-800">业务领域中的对象</strong></p>
              <div class="mt-3 flex flex-wrap gap-1.5">
                <span class="chip">User</span>
                <span class="chip">Order</span>
                <span class="chip">Product</span>
                <span class="chip">Payment</span>
              </div>
            </div>
            <div class="rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">

              <p class="mt-2 text-sm leading-6 text-neutral-600">描述：<strong class="font-semibold text-neutral-800">数据库中的数据结构</strong>，例如 Prisma：</p>
              <pre class="tree-pre mt-3 rounded-lg bg-neutral-50 p-3 text-xs">model User {
  id       String
  email    String
  password String
}</pre>
            </div>
          </div>
          <div class="callout callout-warn">
            <span class="callout-icon">!</span>
            <div>三者不应该无脑混为一谈。</div>
          </div>
        </section>
