<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21 依赖倒置 · TS 后端架构</title>
  <meta name="description" content="从最基础的 HTTP 接口开始，逐步理解 TypeScript 后端的分层、模块化、依赖注入、依赖倒置，以及高内聚、低耦合的工程化架构。">
  <meta name="theme-color" content="#ffffff">

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide 图标库 (CDN) -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- 公共样式由父页面 index.html 通过 postMessage 注入；直接打开时由 assets/section.js 从 index.html 抓取 -->
</head>

<body data-section="dip" class="doc-body bg-white font-sans text-neutral-800 antialiased px-3 pb-4 pt-1">

        <!-- 21 依赖倒置 -->
        <section id="dip" class="doc-section">
          <header class="mb-5 flex items-start gap-3">
            <span class="sec-num">21</span>
            <div>
              <p class="eyebrow">依赖管理</p>
              <h2 class="sec-title">依赖倒置</h2>
            </div>
          </header>
          <div class="my-4 grid gap-4 sm:grid-cols-2">
            <div class="cmp-bad">
              <p class="cmp-title text-neutral-400">传统依赖</p>
              <div class="flex flex-col items-center">
                <div class="fr-node w-40 text-center">Business</div>
                <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
                <div class="fr-node w-40 border-neutral-300 bg-white text-center text-neutral-400">Prisma</div>
              </div>
            </div>
            <div class="cmp-good">
              <p class="cmp-title text-neutral-900">更合理</p>
              <div class="flex flex-col items-center">
                <div class="fr-node w-40 text-center">Business</div>
                <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
                <div class="fr-node w-40 border-neutral-900 bg-white text-center font-bold text-neutral-900">Interface</div>
                <div class="flow-arrow"><i data-lucide="arrow-up"></i></div>
                <div class="fr-node w-40 text-center">Prisma</div>
              </div>
            </div>
          </div>
          <p class="doc-p">业务依赖抽象，而不是具体实现。例如：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">interface UserRepository {
  findById(id: string): Promise&lt;User | null&gt;;
}</code></pre>
          </figure>
          <p class="doc-p">业务：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">class UserService {
  constructor(
    private readonly userRepository: UserRepository,
  ) {}
}</code></pre>
          </figure>
          <p class="doc-p">基础设施：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">class PrismaUserRepository
  implements UserRepository {
}</code></pre>
          </figure>
          <p class="doc-p">这样：</p>
          <div class="flow flow-sm">
            <div class="flow-node">业务层</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node flow-node-accent">抽象</div>
            <div class="flow-arrow"><i data-lucide="arrow-up"></i></div>
            <div class="flow-node">基础设施</div>
          </div>
          <div class="callout callout-key">
            <span class="callout-icon"><i data-lucide="arrow-down-up"></i></span>
            <div>这就是 <strong class="font-semibold text-neutral-900">Dependency Inversion Principle</strong>。</div>
          </div>
        </section>

</html>
