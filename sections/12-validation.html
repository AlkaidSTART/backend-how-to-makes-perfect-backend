<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12 参数校验 · TS 后端架构</title>
  <meta name="description" content="从最基础的 HTTP 接口开始，逐步理解 TypeScript 后端的分层、模块化、依赖注入、依赖倒置，以及高内聚、低耦合的工程化架构。">
  <meta name="theme-color" content="#ffffff">

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide 图标库 (CDN) -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- 公共样式由父页面 index.html 通过 postMessage 注入；直接打开时由 assets/section.js 从 index.html 抓取 -->
</head>

<body data-section="validation" class="doc-body bg-white font-sans text-neutral-800 antialiased px-3 pb-4 pt-1">

        <!-- 12 参数校验 -->
        <section id="validation" class="doc-section">
          <header class="mb-5 flex items-start gap-3">
            <span class="sec-num">12</span>
            <div>
              <p class="eyebrow">数据与校验</p>
              <h2 class="sec-title">参数校验</h2>
            </div>
          </header>
          <p class="doc-p">API 输入不能完全信任客户端。例如一个 <code>email</code> 字段，需要验证：</p>
          <ul class="my-4 grid gap-x-8 gap-y-2.5 sm:grid-cols-2">
            <li class="check-item"><span class="check-dot"><i data-lucide="check"></i></span>是否存在</li>
            <li class="check-item"><span class="check-dot"><i data-lucide="check"></i></span>是否是字符串</li>
            <li class="check-item"><span class="check-dot"><i data-lucide="check"></i></span>是否符合邮箱格式</li>
            <li class="check-item"><span class="check-dot"><i data-lucide="check"></i></span>长度是否合理</li>
          </ul>
          <p class="doc-p">常见方案：</p>
          <div class="my-4 flex flex-wrap gap-2">
            <span class="chip">Zod</span>
            <span class="chip">class-validator</span>
            <span class="chip">Valibot</span>
          </div>
          <p class="doc-p">现代 TypeScript 项目可以考虑 Zod：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">const CreateUserSchema = z.object({
  name: z.string().min(1),
  email: z.email(),
  password: z.string().min(6),
});</code></pre>
          </figure>
          <div class="callout callout-key">
            <span class="callout-icon"><i data-lucide="shield-check"></i></span>
            <div>核心思想：<strong class="font-semibold text-neutral-900">API 边界必须进行输入验证。</strong></div>
          </div>
        </section>

  <!-- highlight.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/http.min.js"></script>
  <!-- 小节共用脚本：高亮、复制、图标、高度同步 -->
  <script src="../assets/section.js"></script>
</body>
</html>
