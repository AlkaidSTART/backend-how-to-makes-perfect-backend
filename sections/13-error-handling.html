<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13 第六阶段：错误处理 · TS 后端架构</title>
  <meta name="description" content="从最基础的 HTTP 接口开始，逐步理解 TypeScript 后端的分层、模块化、依赖注入、依赖倒置，以及高内聚、低耦合的工程化架构。">
  <meta name="theme-color" content="#ffffff">

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide 图标库 (CDN) -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- 公共样式由父页面 index.html 通过 postMessage 注入；直接打开时由 assets/section.js 从 index.html 抓取 -->
</head>

<body data-section="error-handling" class="doc-body bg-white font-sans text-neutral-800 antialiased px-3 pb-4 pt-1">

        <!-- 13 第六阶段：错误处理 -->
        <section id="error-handling" class="doc-section">
          <header class="mb-5 flex items-start gap-3">
            <span class="sec-num">13</span>
            <div>
              <p class="eyebrow">错误与响应</p>
              <h2 class="sec-title">第六阶段：错误处理</h2>
            </div>
          </header>
          <p class="doc-p">不要在项目中到处 <code>throw new Error("xxx")</code>，可以逐渐形成明确的错误类型。例如：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">class UserNotFoundError extends Error {}</code></pre>
          </figure>
          <p class="doc-p">业务层：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="code-lang">TypeScript</span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">if (!user) {
  throw new UserNotFoundError();
}</code></pre>
          </figure>
          <p class="doc-p">然后通过统一异常处理：</p>
          <div class="flow flow-sm">
            <div class="flow-node">Service</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node">throw Error</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node">Global Exception Handler</div>
            <div class="flow-arrow"><i data-lucide="arrow-down"></i></div>
            <div class="flow-node flow-node-accent">HTTP Response</div>
          </div>
          <p class="doc-p">而不是每个 Controller 都自己：</p>
          <figure class="code-card">
            <figcaption class="code-head">
              <span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="flex items-center gap-2">
                <span class="code-flag bad">不推荐</span>
                <span class="code-lang">TypeScript</span>
              </span>
              <button class="code-copy" type="button">复制</button>
            </figcaption>
            <pre class="code-body"><code class="language-ts">try {
  ...
} catch (error) {
  return res.status(500).json(...)
}</code></pre>
          </figure>
        </section>

  <!-- highlight.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/http.min.js"></script>
  <!-- 小节共用脚本：高亮、复制、图标、高度同步 -->
  <script src="../assets/section.js"></script>
</body>
</html>
